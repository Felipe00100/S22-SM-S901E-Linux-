SectionVerb {
	EnableSequence [
		# MultiMedia1 -> PRIMARY_MI2S_RX, where both CS35L41 amps listen
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		# Capture: DMICs through the VA macro's LPASS DMA (VA_CODEC_DMA_TX_0) into MultiMedia3
		cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' 1"

		# Ensure CS35L41 Halo DSP1 speaker protection stays in-path on both amps
		cset "name='Speaker DSP1 Preload Switch' 1"
		cset "name='Earpiece DSP1 Preload Switch' 1"
		cset "name='Speaker DSP1RX1 Source' ASPRX1"
		cset "name='Speaker DSP1RX2 Source' ASPRX1"
		cset "name='Earpiece DSP1RX1 Source' ASPRX1"
		cset "name='Earpiece DSP1RX2 Source' ASPRX1"
		cset "name='Speaker PCM Source' DSP"
		cset "name='Earpiece PCM Source' DSP"
		cset "name='Speaker Analog PCM Volume' 19"
		cset "name='Earpiece Analog PCM Volume' 18"
	]

	DisableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers (bottom + earpiece, 2x CS35L41 Halo Protected)"

	ConflictingDevice [
		"Earpiece"
	]

	EnableSequence [
		cset "name='Speaker PCM Source' DSP"
		cset "name='Earpiece PCM Source' DSP"
		cset "name='Speaker Analog PCM Volume' 19"
		cset "name='Earpiece Analog PCM Volume' 18"
		cset "name='Speaker Digital PCM Volume' 895"
		cset "name='Earpiece Digital PCM Volume' 880"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Earpiece" {
	Comment "Top handset earpiece (CS35L41 @ 0x41)"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='Speaker Digital PCM Volume' 0"
		cset "name='Earpiece Analog PCM Volume' 18"
		cset "name='Earpiece Digital PCM Volume' 865"
	]

	DisableSequence [
		cset "name='Speaker Digital PCM Volume' 895"
		cset "name='Earpiece Digital PCM Volume' 880"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic" {
	Comment "Built-in digital microphones"

	EnableSequence [
		cset "name='VA DMIC MUX0' DMIC1"
		cset "name='VA DMIC MUX1' DMIC4"
		cset "name='VA DEC0 MUX' VA_DMIC"
		cset "name='VA DEC1 MUX' VA_DMIC"
		cset "name='VA_AIF1_CAP Mixer DEC0' 1"
		cset "name='VA_AIF1_CAP Mixer DEC1' 1"
		cset "name='VA_DEC0 Volume' 112"
		cset "name='VA_DEC1 Volume' 112"
	]

	DisableSequence [
		cset "name='VA_AIF1_CAP Mixer DEC0' 0"
		cset "name='VA_AIF1_CAP Mixer DEC1' 0"
		cset "name='VA DMIC MUX0' ZERO"
		cset "name='VA DMIC MUX1' ZERO"
	]

	Value {
		CaptureChannels 2
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
	}
}
