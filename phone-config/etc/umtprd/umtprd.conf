# FunctionFS configuration
usb_functionfs_mode 0x1
usb_dev_path   "/dev/mtp/ep0"
usb_epin_path  "/dev/mtp/ep1"
usb_epout_path "/dev/mtp/ep2"
usb_epint_path "/dev/mtp/ep3"
usb_max_packet_size 0x400

# Standard USB Still Image / MTP class (06:01:01) so BOTH Android OTG hosts
# (MtpDocumentsProvider) AND Windows/Linux/macOS PCs enumerate MTP natively.
usb_class 0x6
usb_subclass 0x1
usb_protocol 0x1
interface "MTP"

loop_on_disconnect 1

storage "/home/netobr" "Galaxy S22" "rw"

manufacturer "Samsung"
product "Galaxy S22 (Linux)"
